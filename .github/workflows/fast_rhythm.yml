name: AICOR Fast Rhythm Sync (Every 6h)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_fast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Fast Rhythm Crawlers (Stock & Google Trends)
        run: |
          python run_pipeline.py --mode crawl --rhythm fast

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/*.csv data/processed/sync_log.csv
          if [ -n "$(git status --porcelain)" ]; then
            echo "New data detected. Committing and pushing..."
            git commit -m "Auto-sync (fast rhythm 6h): update stock and trends [skip ci]"
            git push origin main
          else
            echo "No new data changes detected. Everything is up-to-date."
          fi
