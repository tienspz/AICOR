name: AICOR Slow Rhythm Sync & Full Computation (Daily)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_slow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Pipeline (Crawl, Clean, Compute CSVs)
        run: |
          python run_pipeline.py --mode full

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/*.csv data/cleaned/*.csv data/processed/*.csv data/processed/manifest.json
          git diff --staged --quiet || git commit -m "Auto-sync (slow rhythm daily): clean and recompute quarterly indices [skip ci]"
          git push
