name: AICOR EDGAR 10-Q Monitor (Weekly)

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edgar_monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check SEC EDGAR for new MSFT 10-Q and auto-sync
        run: |
          python -c "from src.collection.edgar_monitor import run_edgar_monitor; print(run_edgar_monitor(auto_sync=True))"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/*.csv data/cleaned/*.csv data/processed/*.csv data/processed/*.json data/processed/*.db data/processed/manifest.json
          if [ -n "$(git status --porcelain)" ]; then
            echo "New EDGAR data detected. Committing and pushing..."
            git commit -m "Auto-sync (edgar rhythm weekly): detect new MSFT 10-Q and recompute [skip ci]"
            git push origin main
          else
            echo "No new EDGAR filing. Everything is up-to-date."
          fi
