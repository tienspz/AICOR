[project]
name = "aicor"
version = "0.1.0"
description = "AI Investment & Corporate Outcome Research — crawl + preprocess pipeline"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "yfinance>=0.2",
    "pytrends>=4.9",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aicor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: marks tests that hit real network endpoints (deselect with '-m \"not live\"')",
]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 120
