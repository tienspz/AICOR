# Baseline configuration for preprocessing parameters
# Referenced by: §7.2, §7.3, §7.5

version: "v1"

# Rolling z-score window (quarters)
z_window: 16

# Trends normalization method
trends_norm: "minmax_16q"

# MA4Q strict minimum periods
ma4q_min_periods: 4

# Z-score standard deviation degrees of freedom
zscore_ddof: 1

# Outlier detection
outlier_method: "iqr"
outlier_iqr_multiplier: 1.5

# Weight configurations for In/Out/E (§7.4)
# NOTE: E = Out - In computation belongs to Compute phase, not this phase.
# These weights are recorded here for config versioning (NFR-03).
weight_configs:
  baseline:
    product_weight: 0.6
    trends_weight: 0.4
  sensitivity_1:
    product_weight: 0.5
    trends_weight: 0.5
  sensitivity_2:
    product_weight: 0.7
    trends_weight: 0.3
