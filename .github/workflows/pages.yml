name: Deploy dashboard (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
  workflow_run:
    workflows:
      - "Pipeline (collect → analysis → publish)"
      - "Crawl SEC EDGAR (Tier S)"
      - "Crawl Market (Tier B)"
      - "Crawl Trends (Tier B)"
      - "Crawl IR (Tier A)"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # A failed pipeline run must not publish stale-but-broken output.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
